<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEC CampusMind AI | Annapoorana Engineering College, Salem</title>
  
  <!-- Auth Guard & Session Initializer for AEC Assist RAG -->
  <script>
    if (!sessionStorage.getItem('aec_auth')) {
      sessionStorage.setItem('aec_auth', JSON.stringify({
        role: 'student',
        username: 'student',
        label: 'Student'
      }));
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aec: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              800: '#1e3a8a',
              900: '#172554'
            },
            gold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706'
            },
            campus: {
              50: '#eef2ff',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81'
            },
            teal: {
              50: '#f0fdfa',
              500: '#14b8a6',
              600: '#0d9488'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for JSX -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Marked for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.35);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.65);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
    }
    .dark .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
    }
    .markdown-body h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .markdown-body h4 {
      font-size: 1.02rem;
      font-weight: 600;
      margin-top: 0.75rem;
      margin-bottom: 0.25rem;
      color: #4f46e5;
    }
    .dark .markdown-body h4 {
      color: #818cf8;
    }
    .markdown-body ul {
      list-style-type: disc;
      padding-left: 1.25rem;
      margin-top: 0.25rem;
      margin-bottom: 0.5rem;
    }
    .markdown-body li {
      margin-top: 0.2rem;
      margin-bottom: 0.2rem;
      line-height: 1.5;
    }
    .markdown-body blockquote {
      border-left: 4px solid #6366f1;
      padding-left: 0.75rem;
      font-style: italic;
      color: #4b5563;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .dark .markdown-body blockquote {
      color: #9ca3af;
      border-left-color: #818cf8;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-full transition-colors duration-200">
  <div id="root"></div>

  <!-- Load Main React Application -->
  <script type="text/babel" src="/static/js/app.js"></script>
</body>
</html>
